name: re-caRing PR Validation

on:
   pull_request:
      branches:
         - main
         - develop

jobs:
   test:
      environment: test
      runs-on: ubuntu-latest

      steps:
         - uses: actions/checkout@v4

         - name: Setup JDK 21
           uses: actions/setup-java@v4
           with:
              java-version: '21'
              distribution: 'temurin'

         - name: Setup Gradle
           uses: gradle/actions/setup-gradle@v5
           with:
              cache-read-only : false

         - name: Grant execute permission for gradlew
           run: chmod +x gradlew

         - name: Test
           run: ./gradlew clean test

         - name: Build
           run: ./gradlew build -x test

   integration-test:
      environment: test
      runs-on: ubuntu-latest
      # A container that never starts, or a stale context cache, holds the runner forever.
      timeout-minutes: 15

      steps:
         - uses: actions/checkout@v4

         - name: Setup JDK 21
           uses: actions/setup-java@v4
           with:
              java-version: '21'
              distribution: 'temurin'

         - name: Setup Gradle
           uses: gradle/actions/setup-gradle@v5
           with:
              # The test job writes the cache; two concurrent writers overwrite each other.
              cache-read-only: true

         - name: Grant execute permission for gradlew
           run: chmod +x gradlew

         - name: Integration test
           run: ./gradlew integrationTest

         - name: Upload test report
           if: failure()
           uses: actions/upload-artifact@v4
           with:
              name: integration-test-report
              path: build/reports/tests/integrationTest
              retention-days: 7