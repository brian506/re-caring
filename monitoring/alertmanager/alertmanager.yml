global:
  resolve_timeout: 5m

route:
  receiver: recaring-webhook
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 30m

receivers:
  - name: recaring-webhook
    webhook_configs:
      - url: 'http://host.docker.internal:8080/api/v1/alerts/webhook'
        send_resolved: true
        http_config:
          headers:
            X-Webhook-Secret: 'local-webhook-secret'
