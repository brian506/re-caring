groups:
  - name: recaring.gps
    rules:

      # GPS 수신 중단: 10분 동안 GPS 쓰기 요청 없음
      - alert: GpsDataStale
        expr: |
          sum(rate(http_server_requests_seconds_count{
            job="spring-boot-local",
            uri="/api/v1/location/gps",
            method="POST",
            status="200"
          }[10m])) == 0
        for: 5m
        labels:
          severity: CRITICAL
        annotations:
          summary: "GPS 데이터 수신 중단"
          description: "10분 동안 GPS 데이터가 수신되지 않고 있습니다."
